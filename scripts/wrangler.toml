# CitizenServe 的 Worker 与主 D1 使用唯一产品名；下载数据库按 CitizenWeb 公开下载职责命名。
name = "citizenserve"
main = "../src/index.ts"
compatibility_date = "2026-07-23"
workers_dev = false
preview_urls = false
routes = [{ pattern = "www.crcfrcn.com/api/*", zone_name = "crcfrcn.com" }]

# Free 计划由平台固定 CPU 与 50 次外部 subrequest 上限；显式提交 limits 会被当前
# Workers Versions API 当作付费 CPU limit 拒绝。这里不覆盖平台边界，业务代码继续执行更严限制。

# 候选版本验收必须从真实响应读取精确 Worker version id，禁止只凭 HTTP 200 切流。
[version_metadata]
binding = "CF_VERSION_METADATA"

# 正式部署由产品发布器一次性提交完整Secret集合；公开标识通过Worker var单独传入，
# 不再把账户、Zone、URL、推送项目标识伪装成 Secret。
[secrets]
required = [
  "R2_KEY", "R2_SECRET", "PURGE",
  "CHAIN_ID", "CHAIN_SECRET", "APNS_KEY", "FCM_KEY",
  "HASH_KEY", "TURNSTILE_SECRET", "SETTLE_TOKEN", "TOPUP_INTENT_SECRET",
  "CITIZENCHAIN_DOWNLOAD_PUBLISH_SECRET",
  "CHAT_AUTH_ED25519_PRIVATE_KEY",
]

# CitizenServe Cloudflare只保留唯一生产环境。普通变量与Secret都由产品发布器在发布
# 时经一次 Touch ID 读取；只有真正凭据进入 Worker Secret，值均不写入仓库。

[[r2_buckets]]
binding = "SQUARE_PRIVATE"
bucket_name = "citizenserve-private"

# 已发布帖子媒体专用公开桶；仅通过 media.crcfrcn.com 交付，不启用公开开发域名。
[[r2_buckets]]
binding = "SQUARE_PUBLIC_MEDIA"
bucket_name = "citizenserve-media"

[[d1_databases]]
binding = "DB"
database_name = "citizenserve"
database_id = "e7e7a15f-fd28-4553-9723-30ced7199b8e"

# 公民链官网下载只保存产品发布器显式提交的四个平台指针，与CitizenServe业务数据物理隔离。
[[d1_databases]]
binding = "CITIZENCHAIN_DOWNLOAD_DB"
database_name = "citizenweb-download"
database_id = "fa70d613-ff33-43d3-aecd-84f1baef3918"

[[kv_namespaces]]
binding = "SQUARE_CACHE"
id = "d632942d82c94e45ab4058fa69268ce1"

# 边缘本地计数器不写 D1；认证、写请求与读请求分档，避免限流本身放大数据库账单。
[[ratelimits]]
name = "RATE_AUTH"
namespace_id = "896401"

[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "RATE_WRITE"
namespace_id = "896402"

[ratelimits.simple]
limit = 30
period = 60

[[ratelimits]]
name = "RATE_READ"
namespace_id = "896403"

[ratelimits.simple]
limit = 120
period = 60

[[queues.producers]]
binding = "NOTIFY"
queue = "citizenserve"

[[queues.consumers]]
queue = "citizenserve"
max_batch_size = 1
max_retries = 3

[triggers]
# 五分钟事件执行通用清理、身份投影和唯一订阅投影；订阅投影只走既有国储会节点隧道。
# 产品发布器必须把这两条准确同步到生产，禁止保留旧五触发器残留。
crons = ["*/5 * * * *", "4 3 * * *"]

[vars]
# Cloudflare Account ID 是 R2 官方 S3 HTTPS 端点的公开组成部分；由正式 Release 固化，
# 只有 R2 S3 凭据继续作为 Worker Secret 注入。
CF_ACCOUNT_ID = "f088b553d27d9c26b81f48f1924c3bbd"
SESSION_TTL_SECONDS = "86400"
UPLOAD_TTL_SECONDS = "900"
SQUARE_PUBLIC_MEDIA_BUCKET_NAME = "citizenserve-media"
SQUARE_PUBLIC_MEDIA_BASE_URL = "https://media.crcfrcn.com"
MEDIA_TTL_SECONDS = "300"
WEB_ORIGIN = "https://www.crcfrcn.com"
# CitizenServe 只签发短期访问授权；客户端随后直连该唯一 HTTPS 聊天服务根地址。
CHAT_SERVER_URL = "https://chat.crcfrcn.com"
TURNSTILE_SITEKEY = "0x4AAAAAAD0GQRiB2O3a0DYJ"

# 稳定币充值只允许 Base 主网。结算令牌和付款意图密钥必须使用 Worker Secret。
TOPUP_NETWORK = "mainnet"
TOPUP_RECV_ADDRESS = "0x5ce9b56b9d1812a7cf29841e21756f09ca7d223b"
TOPUP_BASE_RPC_URL = "https://mainnet.base.org"
TOPUP_USDC_CONTRACT = ""
