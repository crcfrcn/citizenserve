# 当前重建基线配置，不代表整个CitizenServe已经恢复或可上线替换。
name = "citizenserve"
main = "../target/build/cloudflare/worker/index.js"
compatibility_date = "2026-10-07"
# Rust worker::Delay沿用Web数字计时器合同，不修改续租时长或放宽截止时间。
compatibility_flags = ["no_nodejs_global_timers"]
workers_dev = false
preview_urls = false
routes = [{ pattern = "www.crcfrcn.com/api/*", zone_name = "crcfrcn.com" }, { pattern = "nrcrpc.crcfrcn.com", custom_domain = true }, { pattern = "media.crcfrcn.com/square/*", zone_name = "crcfrcn.com" }]

[secrets]
required = ["HASH_KEY", "TURNSTILE_SECRET", "CHAIN_SECRET", "R2_KEY", "R2_SECRET", "PURGE", "TOPUP_INTENT_SECRET", "TOPUP_DISBURSE_KEY", "SETTLE_TOKEN", "APNS_KEY", "FCM_KEY", "TATACHAT_AUTH_KEY"]

[[d1_databases]]
binding = "DB"
database_name = "citizenserve"
database_id = "c6dc4d75-9496-4d6f-a599-b0541655c433"

[[ratelimits]]
name = "RATE_AUTH"
namespace_id = "896401"
[ratelimits.simple]
limit = 10
period = 60

[triggers]
crons = ["*/5 * * * *", "4 3 * * *"]

[vars]
WEB_ORIGIN = "https://www.crcfrcn.com"
REGISTRATION_SCOPE = "citizenserve:production"
# 真实签发key_id由环境提供，不猜填；缺配置令许可接口明确失败。
TATACHAT_AUTH_KID = ""
# 以下公开运行值由正式发布装配取得，空值不得进入部署版本。
CHAIN_URL = ""
CF_ACCESS_CLIENT_ID = ""
ZONE_ID = ""
APNS_KID = ""
APNS_TEAM = ""
APNS_TOPIC = ""
FCM_EMAIL = ""
FCM_PROJECT = ""
TATACHAT_QUEUE_NAME = "citizenserve-tatachat"
TURNSTILE_SITEKEY = "0x4AAAAAAD0GQRiB2O3a0DYJ"
CHAIN_GENESIS_HASH = "0x18847a5dfd263272f2e7727836fe6582f8c4463ff48609df7b96d5e4d9dd24dd"

CHAIN_STATE_ROOT = "0x1f74a2ca094fc3ebb2143f504d807a6b4f4f9b0a3d13ac808ae84efc7cb12111"
# 未核实当前线上节点/bootnodes，不猜填；RELAY_ENABLED显式关闭。
RELAY_ENABLED = "0"
CHAIN_BOOTNODES = ""
# 五网络HTTPS RPC和三个格式的收款账户由部署配置交付；空值明确不可用。
TOPUP_RPCS = ""
TOPUP_RECEIVERS = ""

CF_ACCOUNT_ID = "f088b553d27d9c26b81f48f1924c3bbd"
SQUARE_PUBLIC_MEDIA_BASE_URL = "https://media.crcfrcn.com"

[[r2_buckets]]
binding = "SQUARE_PRIVATE"
bucket_name = "citizenserve-private"

[[r2_buckets]]
binding = "SQUARE_PUBLIC_MEDIA"
bucket_name = "citizenserve-media"

[[ratelimits]]
name = "RATE_READ"
namespace_id = "896403"
[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "RATE_WRITE"
namespace_id = "896402"
[ratelimits.simple]
limit = 30
period = 60

[[kv_namespaces]]
binding = "SQUARE_CACHE"
id = "ecdd9930e9814c2eaf06369267d87856"

# 推送公开标识由实际产品配置提供，不猜填；缺配置阻塞对应任务而不删端点。
[[queues.producers]]
binding = "NOTIFY"
queue = "citizenserve"

[[queues.consumers]]
queue = "citizenserve"
max_batch_size = 1
max_retries = 3

# 聊天资源使用本次重建的生产资源；Worker 与 DO 仍须在获准发布后回查实际绑定。
[[d1_databases]]
binding = "TATACHAT_DB"
database_name = "citizenserve-tatachat"
database_id = "d7d94fd2-bcf1-4191-b13f-cca482dc67bb"

[[r2_buckets]]
binding = "TATACHAT_ATTACHMENTS"
bucket_name = "citizenserve-tatachat"

[durable_objects]
bindings = [{ name = "TATACHAT_DEVICES", class_name = "TataChatDevice" }]

[[migrations]]
tag = "tatachat-1"
new_sqlite_classes = ["TataChatDevice"]

[[queues.producers]]
binding = "TATACHAT_PUSH"
queue = "citizenserve-tatachat"

[[queues.consumers]]
queue = "citizenserve-tatachat"
max_batch_size = 1
max_retries = 5
