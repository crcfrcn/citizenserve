[package]
name = "citizenserve-cloudflare"
version = "1.0.0"
edition = "2021"
publish = false
[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]
[dependencies]
citizenserve = { path = "../.." }
js-sys = "=0.3.104"
wasm-bindgen = "=0.2.127"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
worker = { version = "=0.8.5", features = ["d1", "queue"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
url = "=2.5.8"
web-sys = { version = "=0.3.104", features = ["Crypto", "CryptoKey", "SubtleCrypto", "AbortSignal"] }
futures-util = "=0.3.34"
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.2.17", features = ["js"] }
