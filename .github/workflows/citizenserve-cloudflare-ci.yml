# CitizenServe Cloudflare ci；Workflow只交付Runner和受控能力，实际步骤归产品入口。
name: citizenserve.cloudflare.ci
run-name: "${{ inputs.run_title }}"
'on':
  workflow_dispatch:
    inputs:
      pipeline:
        required: true
        type: string
      run_title:
        required: true
        type: string
      source_sha:
        required: false
        type: string
      ci_run_id:
        required: false
        type: string
      version_tag:
        required: false
        type: string
      software_version:
        required: false
        type: string
      spec_version:
        required: false
        type: string
      chain_spec_version:
        required: false
        type: string
      genesis_hash:
        required: false
        type: string
      finalized_head:
        required: false
        type: string
concurrency:
  group: citizenserve.cloudflare.ci
  cancel-in-progress: false
jobs:
  flow:
    name: 公民服务端 · Cloudflare · CI
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: "${{ github.token }}"
    steps:
    - name: 检出准确产品源码
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        fetch-depth: 0
        persist-credentials: false
    - name: 装载准确Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 25.2.1
    - name: 执行产品完整CI
      shell: node {0}
      run: |
        require('node:child_process').execFileSync(process.execPath,
          ['scripts/ci/cloudflare.mjs', 'execute'], {stdio: 'inherit'});
    - name: 上传本次成功Attempt的完整CI资产
      id: artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: citizenserve-cloudflare-ci-${{ github.run_id }}-${{ github.run_attempt }}
        path: target/build/ci.tgz
        if-no-files-found: error
        overwrite: false
        compression-level: 0
        retention-days: 90
    - name: 回读实际Artifact身份及摘要
      shell: node {0}
      env:
        PRODUCT_ARTIFACT_ID: "${{ steps.artifact.outputs.artifact-id }}"
        PRODUCT_ARTIFACT_DIGEST: "${{ steps.artifact.outputs.artifact-digest }}"
      run: |
        require('node:child_process').execFileSync(process.execPath,
          ['scripts/ci/cloudflare.mjs', 'verify-upload'], {stdio: 'inherit'});
