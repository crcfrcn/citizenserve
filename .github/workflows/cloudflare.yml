name: 公民服务端·Cloudflare
run-name: 公民服务端·Cloudflare·v${{ inputs.version }}
'on':
  workflow_dispatch:
    inputs:
      version:
        description: 产品 Build 计算的候选版本
        required: true
        type: string
concurrency:
  group: citizenserve-cloudflare-release
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  test:
    name: 公民服务端·Cloudflare·v${{ inputs.version }}
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - name: 恢复本产品官方工具、依赖及编译缓存
        id: compiler_cache
        continue-on-error: true
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: |
            ~/.local/share/product-resources/tools/archives
            ~/.local/share/product-resources/tools/shared
            ~/.local/share/product-resources/tools/parsers
            ~/.local/share/product-resources/rely/archives
            ~/.local/share/product-resources/rely/objects
            ${{ runner.temp }}/citizenserve-cargo
          key: citizenserve-cloudflare-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'package-lock.json', 'test/worker/package-lock.json', 'rust-toolchain.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: citizenserve-cloudflare-${{ runner.os }}-${{ runner.arch }}-
      - name: 本产品完整测试
        run: node scripts/build.mjs ci-test cloudflare
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - name: 恢复本产品官方工具、依赖及编译缓存
        id: compiler_cache
        continue-on-error: true
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: |
            ~/.local/share/product-resources/tools/archives
            ~/.local/share/product-resources/tools/shared
            ~/.local/share/product-resources/tools/parsers
            ~/.local/share/product-resources/rely/archives
            ~/.local/share/product-resources/rely/objects
            ${{ runner.temp }}/citizenserve-cargo
          key: citizenserve-cloudflare-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'package-lock.json', 'test/worker/package-lock.json', 'rust-toolchain.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: citizenserve-cloudflare-${{ runner.os }}-${{ runner.arch }}-
      - name: 调用产品编译并保存本次 Runner 输出
        run: node scripts/build.mjs ci-build cloudflare
      - name: 创建并回读 GitHub 正式产物
        env:
          GH_TOKEN: "${{ github.token }}"
        run: node scripts/build.mjs ci-release cloudflare
      - name: 保存本产品最新缓存
        if: success() || failure()
        continue-on-error: true
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: |
            ~/.local/share/product-resources/tools/archives
            ~/.local/share/product-resources/tools/shared
            ~/.local/share/product-resources/tools/parsers
            ~/.local/share/product-resources/rely/archives
            ~/.local/share/product-resources/rely/objects
            ${{ runner.temp }}/citizenserve-cargo
          key: ${{ steps.compiler_cache.outputs.cache-primary-key }}
