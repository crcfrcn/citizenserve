---
name: citizenserve.cloudflare
run-name: "${{ github.workflow }} · ${{ github.run_number }}"
'on':
  workflow_dispatch: {}
concurrency:
  group: "${{ github.repository }}-cloudflare"
  cancel-in-progress: false
  queue: max
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: "${{ steps.version.outputs.version }}"
      tag: "${{ steps.version.outputs.tag }}"
      source_sha: "${{ steps.version.outputs.source_sha }}"
      run_id: "${{ steps.version.outputs.run_id }}"
      run_attempt: "${{ steps.version.outputs.run_attempt }}"
      run_number: "${{ steps.version.outputs.run_number }}"
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 25.2.1
    - id: version
      env:
        GH_TOKEN: "${{ github.token }}"
      run: node .github/workflows/release-cloudflare.mjs prepare
  flow:
    name: 公民服务端 · Cloudflare · Release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: "${{ github.token }}"
      RELEASE_VERSION: "${{ needs.prepare.outputs.version }}"
      RELEASE_TAG: "${{ needs.prepare.outputs.tag }}"
      CI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 25.2.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.14.3'
    - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
      with:
        toolchain: '1.97.1'
        targets: wasm32-unknown-unknown
        components: clippy,rustfmt
    - name: 准备本目标独占现场
      run: node .github/workflows/release-cloudflare.mjs job
    - name: 产品测试独立验收
      run: node .github/workflows/release-cloudflare.mjs test-product
    - name: Worker编译与组包
      run: node .github/workflows/release-cloudflare.mjs build-cloudflare
    - id: complete
      name: 逐件收集完整正式产物
      run: node .github/workflows/release-cloudflare.mjs collect-produced
    - name: 交付本次完整产物
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-output
        path: "${{ steps.complete.outputs.assets }}"
        if-no-files-found: error
        retention-days: 7
    - name: 清理本目标Runner现场
      if: "${{ always() }}"
      run: node .github/workflows/release-cloudflare.mjs clean
    needs:
    - prepare
  publish:
    needs:
    - prepare
    - flow
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_VERSION: "${{ needs.prepare.outputs.version }}"
      RELEASE_TAG: "${{ needs.prepare.outputs.tag }}"
      GH_TOKEN: "${{ github.token }}"
      CI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 25.2.1
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: release-output
        path: "${{ runner.temp }}/release-output"
    - id: complete
      name: 正式Release上传并逐件回读
      run: node .github/workflows/release-cloudflare.mjs publish "$RUNNER_TEMP/release-output"
  cleanup:
    if: "${{ always() }}"
    needs:
    - prepare
    - flow
    - publish
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: "${{ github.token }}"
      RELEASE_NEEDS: "${{ toJSON(needs) }}"
      RELEASE_TAG: "${{ needs.prepare.outputs.tag }}"
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 25.2.1
    - name: 按全部前置结果清理本目标同类历史
      run: node .github/workflows/release-cloudflare.mjs finish
