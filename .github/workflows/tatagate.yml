# CitizenServe自身push门禁；同提交实现也供本机调用。
name: tatagate
'on':
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: citizenserve.repository.tatagate
  cancel-in-progress: false
jobs:
  gate:
    name: 本仓完整门禁
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 25.2.1
    - name: 调用本提交完整门禁
      shell: node {0}
      run: |
        require('node:child_process').execFileSync(process.execPath,
          ['.github/tatagate/index.mjs', 'remote'], {stdio: 'inherit'});
