# CitizenServe Cloudflare release；Workflow只交付Runner和受控能力，实际步骤归产品入口。
name: citizenserve.cloudflare.release
run-name: "${{ inputs.run_title }}"
'on':
  workflow_dispatch:
    inputs:
      pipeline:
        required: true
        type: string
      run_title:
        required: true
        type: string
      source_sha:
        required: false
        type: string
      ci_run_id:
        required: false
        type: string
      version_tag:
        required: false
        type: string
      software_version:
        required: false
        type: string
      spec_version:
        required: false
        type: string
      chain_spec_version:
        required: false
        type: string
      genesis_hash:
        required: false
        type: string
      finalized_head:
        required: false
        type: string
concurrency:
  group: citizenserve.cloudflare.release
  cancel-in-progress: false
jobs:
  flow:
    name: 公民服务端 · Cloudflare · Release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: write
      attestations: write
      id-token: write
    env:
      GH_TOKEN: "${{ github.token }}"
    steps:
    - name: 检出准确产品源码
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        fetch-depth: 0
        persist-credentials: false
    - name: 装载准确Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 25.2.1
    - name: 执行产品正式候选准备
      shell: node {0}
      run: |
        require('node:child_process').execFileSync(process.execPath,
          ['scripts/release/cloudflare.mjs', 'prepare'], {stdio: 'inherit'});
    - name: 签署三个正式资产的来源证明
      uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
      with:
        subject-path: |
          ${{ github.workspace }}/target/build/citizenserve-cloudflare-release.tgz
          ${{ github.workspace }}/target/build/release-manifest.json
          ${{ github.workspace }}/target/build/SHA256SUMS
    - name: 密码学验真、正式发布与逐资产回读
      shell: node {0}
      run: |
        require('node:child_process').execFileSync(process.execPath,
          ['scripts/release/cloudflare.mjs', 'publish'], {stdio: 'inherit'});
